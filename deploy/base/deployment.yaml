apiVersion: apps/v1
kind: Deployment
metadata:
  name: rebate-attack-force
  labels:
    app: rebate-attack-force
spec:
  # Rooms are held in process memory. Do not increase without shared matchmaking/routing.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rebate-attack-force
  template:
    metadata:
      labels:
        app: rebate-attack-force
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: game
          image: rebate-attack-force:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2567
          env:
            - name: PORT
              value: "2567"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
